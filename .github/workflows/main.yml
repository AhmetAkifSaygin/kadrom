name: APK oluştur

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: İlan verisini ve adresini uygulamaya göm
        run: |
          python3 - <<'PY'
          p = 'app/src/main/assets/index.html'
          h = open(p, encoding='utf-8').read()
          v = open('veri/ilanlar.json', encoding='utf-8').read()
          h = h.replace('__REPO__', '${{ github.repository }}')
          h = h.replace('<script>', '<script>window.GOMULU_VERI = ' + v + ';</script>\n<script>', 1)
          open(p, 'w', encoding='utf-8').write(h)
          PY

      - name: APK derle
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Kadrom-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Telefondan tek linkle indirmek için: .../releases/latest/download/Kadrom.apk
      - name: Son sürümü yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Kadrom.apk
          gh release delete son --yes --cleanup-tag || true
          gh release create son Kadrom.apk --title "Kadrom (son sürüm)" --notes "Her güncellemede otomatik yenilenir." --latest
